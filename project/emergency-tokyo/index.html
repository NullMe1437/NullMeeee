<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>东京都公共场所「无差别伤害」风险评估 — 小组汇报</title>
<style>
:root{
  --ink:#0F172A; --mut:#64748B; --red:#A3121A; --blue:#1D4E89; --teal:#0B6E6E;
  --line:#E3E7EF; --bg:#FFFFFF; --soft:#F6F8FB;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0B1220;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans JP",system-ui,sans-serif;color:var(--ink)}
#viewport{position:fixed;inset:0}
#stage{width:1600px;height:900px;background:var(--bg);position:absolute;left:50%;top:50%;
  box-shadow:0 30px 80px rgba(0,0,0,.55);transform-origin:center center}

/* 满幅图版：把边距让给图 */
.slide.big{padding:20px 22px 12px}
.slide.big .hd{margin-bottom:10px}
.slide.big .col{flex:1 1 100%!important}
.slide.big figure{height:100%}
.slide.big figcaption{display:none}

/* ---------- 通用版式 ---------- */
.slide{position:absolute;inset:0;padding:64px 76px 56px;display:none;flex-direction:column;overflow:hidden}
/* 4:3 投影（或窄窗口）：收窄边距、整体字号略放大，避免缩得太小 */
@media (max-aspect-ratio: 3/2){
  .slide{padding:52px 54px 46px}
  table.t{font-size:23px}
  table.t th,table.t td{padding:13px 12px}
  ul.big li{font-size:26px}
  .lead2{font-size:20px;padding:0 54px}
  .chain div b{font-size:22px}
  .sec6{font-size:17px}
}
.slide.on{display:flex;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hd{display:flex;align-items:baseline;gap:18px;border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:26px}
.step{font-size:20px;font-weight:700;color:#fff;background:var(--red);padding:3px 12px;border-radius:4px;letter-spacing:.04em}
.step.q{background:#8A94A6}
h1{font-size:52px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
h2{font-size:40px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.kicker{font-size:20px;color:var(--mut);margin-top:8px}
.body{flex:1;display:flex;gap:40px;min-height:0;align-items:stretch}
.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.col.solo{width:100%;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:0}
.col.solo > table.t,.col.solo > .two,.col.solo > ul.big{flex:0 0 auto}

ul.big{list-style:none;display:flex;flex-direction:column;gap:16px}
ul.big li{font-size:25px;line-height:1.5;padding-left:26px;position:relative}
ul.big li::before{content:"";position:absolute;left:0;top:12px;width:10px;height:10px;
  border-radius:50%;background:var(--red)}
ul.big li b{color:var(--red)}
ul.big li .n{color:var(--blue);font-weight:700}

table.t{width:100%;border-collapse:collapse;font-size:21px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;vertical-align:top}
table.t th{font-size:18px;color:var(--mut);font-weight:600;letter-spacing:.03em}
table.t td.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
table.t th,table.t td{height:1%}
table.t tr.hi td{background:#FDF4F4}
/* 重点表格：整页只有一张表时放大，后排也看得清 */
.slide.w table.t{font-size:20px}
.slide.w table.t th{font-size:18px}
.slide.w table.t th,.slide.w table.t td{padding:9px 12px}
.slide.k table.t{font-size:27px}
.slide.k table.t th{font-size:19px}
.slide.k table.t th{font-size:19px}
.slide.k table.t th,.slide.k table.t td{padding:17px 14px}
@media (max-aspect-ratio: 3/2){ .slide.k table.t{font-size:29px} }

/* 两栏 + 5×5 矩阵 */
.two{display:flex;gap:36px;align-items:flex-start}
.fine{font-size:18px;color:var(--mut);line-height:1.6;margin-top:16px}
.mxwrap{position:relative}
.swap{margin-top:22px;font-size:19px;line-height:1.65;background:#F4F6FA;border-left:4px solid #1D4E89;
  padding:14px 18px;color:#334155;border-radius:0 6px 6px 0}
.swap b{color:#1D4E89}
.jump{font:inherit;color:#1D4E89;background:#E8EFF8;border:1px solid #C3D4EA;border-radius:6px;
  padding:1px 8px;cursor:pointer;margin:0 2px}
.jump:hover{background:#DCE8F7;border-color:#1D4E89}
.tagx{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:#EEF2F8;
  color:#5B6B82;font-size:12px;vertical-align:1px}
.ucard{border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.ucard.hi{border-color:#EFC7C7;background:#FDF5F5}
.ucard .ut{font-size:16px;letter-spacing:.06em;color:var(--mut)}
.ucard b{font-size:30px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.ucard.hi b{color:var(--red)}
.ucard em{font-size:16px;color:#475569;font-style:normal}
.mxlab{font-size:15px;color:var(--mut);letter-spacing:.1em;margin-bottom:6px}
.mtx{display:grid;grid-template-columns:38px repeat(5,1fr);gap:5px}
.mtx .rl{font-size:15px;color:#94A3B8;display:grid;place-items:center}
.mtx .cl{font-size:15px;color:#94A3B8;display:grid;place-items:center;height:26px}
.mtx .cell{height:70px;display:grid;place-items:center;border-radius:5px;background:#F2F5F9;
  color:#94A3B8;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.mtx .cell.band{background:#FCEBEB;color:#A3121A;outline:2px solid #A3121A;outline-offset:-2px}
.mtx .cell.band.core{background:#F6D3D3}
.mtx .cell.ex{background:#FFFFFF;outline:2px dashed #1D4E89;color:#1D4E89}

figure{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;width:100%;height:100%}
figure .imgbox{position:relative;display:inline-block;max-width:100%;max-height:100%;line-height:0}
figure .imgbox > img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
figure img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
figcaption{font-size:17px;color:var(--mut);margin-top:10px;text-align:center}

.note{position:absolute;right:76px;bottom:22px;font-size:17px;color:#9AA3B2;letter-spacing:.06em}

/* ---------- 封面 ---------- */
.cover{justify-content:center;gap:26px}
.cover .tag{font-size:20px;letter-spacing:.22em;color:var(--mut)}
.cover h1{font-size:64px;max-width:1150px}
.cover .sub{font-size:24px;color:#334155;line-height:1.7;max-width:1100px}
.cover .meta{font-size:19px;color:var(--mut);margin-top:8px}

/* ---------- 站点图叠层 ---------- */
.station{flex:1 1 auto;display:flex;gap:26px;min-height:0;margin-top:10px}
.figbox{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.imgbox{position:relative;margin:0 auto}
.imgbox img{width:100%;height:100%;object-fit:contain;display:block}
.cap2{font-size:16px;color:var(--mut);margin-top:8px;text-align:center}
.sec6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:8px;font-size:18px;color:#334155}
/* 图上的点击热区 */
.ov .pt{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;
  background:transparent;cursor:help;pointer-events:auto;z-index:3}
.ov .pt b,.ov .pt em,.ov .pt span{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
  opacity:0;transition:opacity .12s;font-style:normal;pointer-events:none}
.ov .pt b{bottom:26px;background:#111827;color:#fff;font-size:14px;font-weight:700;padding:5px 10px;border-radius:6px}
.ov .pt em{bottom:2px;color:#F3F6FA;font-size:13px;background:#111827;padding:3px 9px;border-radius:6px;opacity:0}
.ov .pt span{bottom:-22px;color:#F3F6FA;font-size:13px;background:#111827;padding:3px 9px;border-radius:6px;opacity:0}
.ov .pt:hover b{opacity:1}
.ov .pt:hover em,.ov .pt:hover span{opacity:1;bottom:auto}
.ov .pt:hover em{transform:translate(-50%,-64px);opacity:1}
.ov .pt:hover span{transform:translate(-50%,-40px);opacity:1}
.hotspot{position:absolute;pointer-events:auto;border:2px dashed rgba(176,24,24,.5);border-radius:8px;background:rgba(255,255,255,.04);cursor:zoom-in;padding:0;transition:.15s}
.hotspot:hover{background:rgba(255,236,236,.55);border-color:#B01818}
.hotspot i{position:absolute;right:-8px;top:-32px;font-style:normal;font-size:15px;font-weight:700;color:#B01818;
  background:#fff;border:2px solid #B01818;border-radius:999px;padding:2px 11px;white-space:nowrap}
/* 放大弹层（挂在 body 上，不随舞台缩放） */
#zoom{position:fixed;inset:0;background:rgba(9,13,20,.9);display:none;place-items:center;z-index:99;padding:44px 52px;
  backdrop-filter:blur(3px);cursor:zoom-out}
#zoom.on{display:grid}
#zoom figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px}
#zoom img{max-width:100%;max-height:82vh;border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.55);background:#fff}
#zoom .zcap{color:#DCE2EC;font-size:19px;letter-spacing:.02em}
#zoom .zx{position:absolute;right:26px;top:20px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);
  color:#fff;font-size:20px;cursor:pointer}
#zoom .zx:hover{background:rgba(255,255,255,.26)}
.sec6 b{color:var(--red);margin-right:7px;font-size:17px}
.lead2{font-size:18.5px;line-height:1.55;color:#25303F;margin-top:10px;max-width:1200px;padding:0 66px}
.lead2 b{color:#111827}
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.chain div{background:#F6F8FB;border-radius:8px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;position:relative}
.chain div::after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:#C3CBD8;font-size:22px}
.chain div:last-child::after{content:""}
.chain b{font-size:20px;color:var(--red);font-variant-numeric:tabular-nums}
.chain span{font-size:19px;font-weight:700;color:#1E293B}
.chain em{font-size:15px;color:var(--mut);font-style:normal}
.reprow{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:0 0 auto;margin-top:6px}
.reprow div{font-size:17px;line-height:1.6;color:#334155;background:#F6F8FB;border-radius:6px;padding:12px 14px}
.reprow .bc{display:block;font-size:15px;letter-spacing:.08em;margin-bottom:4px}
.bc.a{color:var(--blue)} .bc.b{color:var(--red)} .bc.c{color:var(--teal)}
.ov{position:absolute;inset:0;pointer-events:none}
.insetCard{position:absolute;left:1%;top:.5%;width:24%;z-index:40;display:none;background:#fff;
  border:1px solid #DCE3EE;border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.22);padding:6px;cursor:zoom-out}
.insetCard.on{display:block}
.insetCard img{width:100%;height:auto;display:block;border-radius:6px}
.insetCard .cap{display:block;font-size:13px;color:#5B6675;padding:6px 3px 2px;line-height:1.45}
.caseBtn{position:absolute;right:76px;top:96px;font:inherit;font-size:16px;color:#1D4E89;background:#EDF3FB;
  border:1px solid #C7D8EE;border-radius:8px;padding:7px 14px;cursor:pointer}
.caseBtn:hover{background:#DCE9F8}
.caseCard{position:absolute;left:76px;right:76px;top:112px;bottom:126px;z-index:45;display:none;
  background:#fff;border:1px solid #DCE3EE;border-radius:12px;box-shadow:0 18px 50px rgba(15,23,42,.20);
  padding:26px 30px;overflow:auto}
.caseCard.on{display:block}
.caseCard .chd{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.caseCard .chd b{font-size:25px;color:#111827}
.caseCard .chd span{font-size:15px;color:#6B7686}
.caseCard .cx{margin-left:auto;font-size:22px;line-height:1;color:#8792A3;background:none;border:0;cursor:pointer}
.caseCard .ct{font-size:16px}
.caseCard .ct th,.caseCard .ct td{padding:8px 10px}
.caseCard .csum{margin-top:14px;font-size:16px;line-height:1.7;color:#25303F}
.caseCard .csum b{color:#1D4E89}
.chip{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;
  font-size:15px;font-weight:800;padding:3px 8px;border-radius:5px;background:#fff;
  border:2px solid currentColor;cursor:default;white-space:nowrap;line-height:1.1;
  box-shadow:0 1px 3px rgba(15,23,42,.12);transition:opacity .2s,transform .2s}
.chip.a{color:var(--blue)} .chip.b{color:var(--red)} .chip.c{color:var(--teal)}
.layers[data-layer="a"] .chip.b,.layers[data-layer="a"] .chip.c{opacity:.14}
.layers[data-layer="b"] .chip.a,.layers[data-layer="b"] .chip.c{opacity:.14}
.layers[data-layer="c"] .chip.a,.layers[data-layer="c"] .chip.b{opacity:.14}
.layers[data-layer="all"] .chip{opacity:1}
.chip:hover{transform:translate(-50%,-50%) scale(1.12)}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.toolbar button{font:inherit;font-size:17px;font-weight:700;padding:7px 16px;border-radius:6px;
  border:2px solid var(--line);background:#fff;color:#334155;cursor:pointer}
.toolbar button[aria-pressed="true"]{border-color:var(--red);color:var(--red);background:#FDF4F4}
.toolbar .hint{font-size:18px;color:var(--mut);margin-left:auto}

/* ---------- 内联图表（矢量，可动） ---------- */
.chart{width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.chart svg{width:100%;height:auto;max-height:600px;overflow:visible}
.chart svg text{font-size:1.12em}
.c-bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);
  transition:transform .75s cubic-bezier(.2,.85,.25,1)}
.slide.on .c-bar{transform:scaleY(1)}
.c-wbar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);
  transition:transform .7s cubic-bezier(.2,.85,.25,1)}
.slide.on .c-wbar{transform:scaleX(1)}
.c-fade{opacity:0;transition:opacity .5s ease}
.slide.on .c-fade{opacity:1}
.c-line{stroke-dasharray:1600;stroke-dashoffset:1600;transition:stroke-dashoffset 1.3s ease}
.slide.on .c-line{stroke-dashoffset:0}
/* 附录里的图直接显示终态 */
#apx .c-wbar,#apx .c-bar{transform:none}
#apx .c-fade{opacity:1}
#apx .c-line{stroke-dashoffset:0}

/* ---------- 固定翻页按钮 ---------- */
.pgbtn{position:absolute;bottom:24px;width:54px;height:54px;border-radius:50%;border:none;background:#fff;
  box-shadow:0 6px 18px rgba(15,23,42,.18);color:var(--red);font-size:22px;line-height:1;
  display:grid;place-items:center;cursor:pointer;z-index:8;transition:transform .15s,box-shadow .15s,opacity .2s}
.pgbtn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.26)}
.pgbtn[disabled]{opacity:.3;cursor:default;box-shadow:0 2px 8px rgba(15,23,42,.1)}
#pgPrev{left:24px}
#pgNext{right:24px}
/* 目录按钮：每页右上角，等同 G 键 */
#pgGrid{position:absolute;top:20px;right:22px;z-index:9;height:40px;padding:0 16px;border-radius:20px;
  border:1px solid #DDE3EC;background:#fff;color:#334155;font-size:16px;cursor:pointer;
  display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(15,23,42,.10);transition:all .15s}
#pgGrid:hover{border-color:var(--red);color:var(--red);box-shadow:0 8px 20px rgba(15,23,42,.16)}
#pgGrid b{font-size:15px;font-weight:700;color:var(--red)}

/* ---------- 页目录 ---------- */
#grid{position:absolute;inset:0;background:#0B1220;z-index:11;display:none;padding:44px 56px;overflow:auto}
#grid.on{display:block}
#grid h4{color:#9FB0CC;font-size:15px;letter-spacing:.18em;margin-bottom:16px}
#grid .cells{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
#grid .c{background:#151E31;border:1px solid #253149;border-radius:8px;padding:13px 14px;color:#DCE3EF;cursor:pointer;
  min-height:84px;display:flex;flex-direction:column;justify-content:space-between;
  transition:border-color .15s,background .15s}
#grid .c:hover{border-color:var(--red);background:#1B2438}
#grid .c.cur{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
#grid .c b{display:block;font-size:13px;color:#7F8FA8;margin-bottom:8px;letter-spacing:.06em}
#grid .c span{font-size:15px;line-height:1.35}
#grid .foot{margin-top:22px;font-size:14px;color:#6B7A93;letter-spacing:.06em}
#grid .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 26px;margin-top:22px;padding-top:18px;border-top:1px solid #22304A;font-size:15px;color:#B9C6DA}
#grid .keys kbd{display:inline-block;min-width:26px;text-align:center;background:#1D283C;border:1px solid #33425E;border-radius:5px;padding:2px 7px;margin-right:6px;font-size:14px;color:#DCE3EF;font-family:inherit}
#grid .gfoot{display:flex;gap:14px;margin-top:20px}
#grid .gfoot button{background:#1D283C;border:1px solid #33425E;color:#DCE3EF;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer;font-family:inherit}
#grid .gfoot button:hover{border-color:var(--red);color:#fff}

/* ---------- 底部控件 ---------- */
#bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#EDF0F5}
#bar i{display:block;height:100%;background:var(--red);width:0;transition:width .25s}
#pager{position:absolute;right:104px;bottom:20px;font-size:16px;color:#9AA3B2;font-variant-numeric:tabular-nums}
.note{right:104px}
#nav{position:absolute;left:0;top:0;bottom:0;width:11%;cursor:pointer;z-index:5}
#navR{position:absolute;left:auto;right:0;top:0;bottom:0;width:11%;cursor:pointer;z-index:5}
#navR:hover{background:linear-gradient(270deg,rgba(163,18,26,.05),transparent)}
#nav:hover{background:linear-gradient(90deg,rgba(163,18,26,.05),transparent)}


/* ---------- 附录 ---------- */
#apx{position:absolute;inset:0;background:#0B1220;color:#E6EAF2;padding:56px 70px;display:none;z-index:10;overflow:auto}
#apx.on{display:block}
#apx h3{font-size:26px;margin-bottom:18px;color:#fff}
#apx .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
#apx .card{background:#151E31;border:1px solid #253149;border-radius:10px;padding:18px 20px}
#apx .card h5{font-size:17px;color:#9FB0CC;letter-spacing:.08em;margin-bottom:8px}
#apx .card p{font-size:18px;line-height:1.6;color:#DCE3EF}
#apx .gl{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;margin-top:12px}
#apx .gl div{font-size:19px;line-height:1.55;color:#C9D3E4;border-bottom:1px solid #1C2740;padding:7px 0}
#apx .gl b{color:#fff;margin-right:8px;font-weight:700}
#apx .qa{display:grid;gap:12px;margin-top:12px}
#apx .qa div{font-size:19px;line-height:1.62;color:#C9D3E4;background:#141D2E;border-left:3px solid #3A4A66;border-radius:0 6px 6px 0;padding:12px 16px}
#apx .qa b{color:#fff;display:block;margin-bottom:5px;font-size:17px}
#apx .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}
#apx .cards3 .card p{font-size:18px}
#apx .close{position:absolute;right:34px;top:26px;font-size:16px;color:#8FA0BB}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>

<script>
/* =========================================================================
   内容都在这个数组里改。一页一个对象：
   step   左上角步骤标（"" 表示不显示）
   title  标题        kicker  副标题（可省）
   html   正文（可省）  fig  图片路径（可省）   cap  图注（可省）
   ========================================================================= */
const SLIDES = [
{ step:"", cover:true,
  title:"东京都公共场所「无差别伤害」事件<br>风险评估与预案",
  sub:"以交通节点为空间单元，参照英国国家风险登记册的「游走式攻击」条目",
  meta:"应急管理学 · 汇报 · 2026 年秋季",
  },

{ step:"步骤一 · 选风险", title:"研究对象的界定",
  html:`<ul class="big">\n    <li><b>范围：</b>东京都内车站、站台、车厢与站前广场，一至两人持刀，对不特定对象实施攻击</li>\n    <li><b>判据四条：</b>故意；与被害者无面识；发生于公众可通行场所；造成身体伤害。过失与商业纠纷不纳入</li>\n    <li><b>分类依据：</b>按行为方式归入恐怖主义项下的「游走式攻击」。现场处置动作与恐袭一致；动机认定属司法范畴，不作为本节分类依据</li>\n    <li><b>未选取其他类型的理由：</b>抢夺、诈骗与暴力团冲突均已有成熟对策与统计口径，分析的增量有限；与此研究范围差异较大</li>
  </ul>`,
  },

{ step:"步骤二 · 理解", title:"风险归类：恐怖主义项下的游走式攻击",
  html:`<table class="t">
    <tr><th style="width:22%"></th><th>恐怖主义（NRR: Terrorism）</th><th>社会风险（NRR: Societal · public disorder）</th></tr>
    <tr><td>行为结构</td><td>少数人、有预谋、目标是公众</td><td>多人、动员式、目标是制度</td></tr>
    <tr><td>动机</td><td>不作限定（政治、报复、求死均可）</td><td>长期积怨或单一事件的反弹</td></tr>
    <tr><td>响应重心</td><td>先制、封锁、处置</td><td>维持秩序、疏散、沟通</td></tr>
    <tr class="hi"><td><b>定位</b></td><td colspan="2"><b>按手法归入 Terrorism 下的 marauding attack；不按动机归类</b></td></tr>
  </table>
  <p class="fine"><span style="font-size: 19px;">动机一栏不作限定的依据：ProtectUK（英国政府反恐信息平台）对该攻击的定义只描述行为——攻击者在其移动的场所内寻找目标，尽可能造成杀伤；定义本身不设动机门槛。</span></p>
  <table class="t" style="display:none">
  </table>
  <p class="fine"><span style="font-size: 18px;">社会风险项下收录的是动员型事件，其处置逻辑为维持秩序、疏散与沟通，与本类事件的响应结构不同。</span></p>`,
  },

      <p class="fine" style="margin-top:6px">NRR 的定位方式（非等距刻度）。本研究落在可能性 4–5 × 影响 2–4。</p>

{ step:"步骤三 · 建议", title:"建议措施：六项近期与一项长期",
  html:`<ul class="big">\n    <li><b>管内可实施（3 条）：</b>站台端部增设广角镜与照明（Metro 设施部）；预设广播词定稿并下发（站员与运行指令所）；站员 3 分钟处置演练（受托企业 Metro Commerce）</li>\n    <li><b>需多方协同（2 条）：</b>警视厅与事业者共设指挥席位；消防厅在主要换乘站预置临时救护所与检伤点</li>\n    <li><b>需修改文本（1 条）：</b>将事后复盘与时限公开写入都的规程</li>\n    <li><b>长期项（1 条）：</b>国土交通省制定站台门与监控的组合标准</li>\n    <li><b>不予列入的一些：</b>全面安检、无差别增设摄像头、模糊表述为「加强管理」等</li>
  </ul>
  <p class="fine"><span style="font-size: 20px;">三类建议的实施周期不同：管内三项可于一年内实施，协同项需配合预算年度，文本修改取决于都议会审议。</span></p>`,
  },

  g+=`<text class="c-fade" style="transition-delay:1.35s" x="${bx}" y="${ty+168}" font-size="17" font-weight="700" fill="${BLU}" data-he-unit="253" data-he-kind="chart">事件占比并不总是决定资源分配，有时后果结构决定。</text>`;
  // 右：折线
  g+=`<text x="${px0}" y="28" font-size="21" font-weight="700" fill="${INK}">全国「通り魔」认知件数</text>`;
  g+=`<text x="${px0}" y="54" font-size="15" fill="${MUT}">2017–2024（件，含未遂）</text>`;
  [0,3,6,9,12].forEach(v=>{
    g+=`<line x1="${px0}" y1="${Y(v)}" x2="${px1}" y2="${Y(v)}" stroke="#EDF0F5" stroke-width="1"/>`;
    g+=`<text x="${px0-10}" y="${Y(v)+5}" font-size="13" fill="#94A3B8" text-anchor="end">${v}</text>`;
  });
  g+=`<polyline class="c-line" style="transition-delay:.15s" points="${poly}" fill="none" stroke="${RED}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  vals.forEach((v,i)=>{
    g+=`<circle class="c-fade" style="transition-delay:${.5+i*.07}s" cx="${X(i)}" cy="${Y(v)}" r="5.5" fill="#fff" stroke="${RED}" stroke-width="3"/>`;
    g+=`<text class="c-fade" style="transition-delay:${.55+i*.07}s" x="${X(i)}" y="${Y(v)-14}" font-size="16" font-weight="700" fill="${i===vals.length-1?RED:'#334155'}" text-anchor="middle">${v}</text>`;
    g+=`<text x="${X(i)}" y="${py0+22}" font-size="13" fill="${MUT}" text-anchor="middle">${yrs[i]}</text>`;
  });
  g+=`<text class="c-fade" style="transition-delay:1.3s" x="${px1}" y="${py0+58}" font-size="16" font-weight="700" fill="${RED}" text-anchor="end">2024 年 10 件，为 2008 年以来最高</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* ---------- 图 2：事件序列 ---------- */
function chartD2(){
  const W=1120,H=520, base=360;
  const ev=[
    ["2021-08-06","小田急线 车内",10,1],
    ["2021-10-15","JR 上野 构内",2,1],
    ["2021-10-31","京王线 车内",17,1],
    ["2022-01-15","东大本乡 校园",3,0],
    ["2024-01-03","JR 山手线 车内",5,1],
    ["2025-05-07","东大前 月台",2,1],
    ["2025-09-30","町田 公寓外阶梯",0,0],
    ["2026-01-23","JR 埼京线 车内",0,1]
  ];
  const gaps=[70,16,76,718,490,146,115];
  const x0=78, step=(W-160)/(ev.length-1);
  let g="";
  ev.forEach((e,i)=>{
    const x=x0+step*i, inj=e[2], isDeath=e[0]==="2025-09-30";
    const h=isDeath?26:Math.max(26,inj*14+8);
    const col=e[3]?BLU:"#94A3B8";
    g+=`<rect class="c-bar" style="transition-delay:${.08*i}s" x="${x-20}" y="${base-h}" width="40" height="${h}"
         fill="${isDeath?'#fff':col}" stroke="${isDeath?RED:col}" stroke-width="${isDeath?3:0}"/>`;
    g+=`<text class="c-fade" style="transition-delay:${.35+.08*i}s" x="${x}" y="${base-h-52}" font-size="16" font-weight="700"
         fill="${isDeath?RED:INK}" text-anchor="middle">${e[1]}</text>`;
    g+=`<text class="c-fade" style="transition-delay:${.42+.08*i}s" x="${x}" y="${base-h-30}" font-size="14"
         fill="${MUT}" text-anchor="middle">${e[0]}</text>`;
    const lab=isDeath?"1 死":(inj?inj+" 伤":"未致伤");
    g+=`<text class="c-fade" style="transition-delay:${.5+.08*i}s" x="${x}" y="${base-h-10}" font-size="15" font-weight="700"
         fill="${isDeath?RED:'#334155'}" text-anchor="middle">${lab}</text>`;
  });
  g+=`<line x1="40" y1="${base}" x2="${W-40}" y2="${base}" stroke="#CBD5E1" stroke-width="2"/>`;
  gaps.forEach((d,i)=>{
    const xa=x0+step*i+26, xb=x0+step*(i+1)-26, y=base+40;
    const hot=d>=490;
    g+=`<line class="c-fade" style="transition-delay:${.9+i*.05}s" x1="${xa}" y1="${y}" x2="${xb}" y2="${y}"
         stroke="${hot?RED:'#C3CBD8'}" stroke-width="1.5"/>`;
    g+=`<path class="c-fade" style="transition-delay:${.9+i*.05}s" d="M ${xb-7} ${y-5} l 7 5 l -7 5"
         stroke="${hot?RED:'#C3CBD8'}" stroke-width="1.5" fill="none"/>`;
    g+=`<text class="c-fade" style="transition-delay:${.95+i*.05}s" x="${(xa+xb)/2}" y="${y-9}" font-size="14"
         font-weight="${hot?700:400}" fill="${hot?RED:'#8A94A6'}" text-anchor="middle">${d} 天</text>`;
  });
    g+=`<text class="c-fade" style="transition-delay:1.65s" x="40" y="${base+126}" font-size="15" fill="${MUT}">按发生顺序排列（非等距）｜实心＝公共交通节点，空心＝其他公共通行空间｜合计 1 死 39 伤</text>`;
  return `<svg viewBox="0 80 ${W} 450" role="img">${g}</svg>`;
}

/* ---------- 图 3：署别与时间带（附录用） ---------- */
function chartD3(){
  const W=1120,H=560;
  const rows=[["新宿",3595,1],["町田",2118,0],["涩谷",2088,0],["蒲田",2031,0],["池袋",1982,0],
              ["立川",1970,0],["田无",1715,0],["小松川",1627,0],["本富士",336,2],["驹込",186,3]];
  const bx=150, maxw=760, mx=3595;
  let g=`<text x="20" y="26" font-size="21" font-weight="700" fill="${INK}">2024 年各署刑法犯认知件数</text>`;
  rows.forEach((r,i)=>{
    const y=54+i*42, w=maxw*r[1]/mx;
    const c=r[2]===1?RED:(r[2]===2?RED:(r[2]===3?"#64748B":"#7FA6D9"));
    g+=`<text x="${bx-12}" y="${y+20}" font-size="16" fill="${INK}" text-anchor="end">${r[0]}</text>`;
    g+=`<rect class="c-wbar" style="transition-delay:${.05*i}s" x="${bx}" y="${y}" width="${Math.max(3,w)}" height="26" rx="3" fill="${c}"/>`;
    g+=`<text class="c-fade" style="transition-delay:${.3+i*.05}s" x="${bx+Math.max(3,w)+10}" y="${y+19}" font-size="15"
         font-weight="700" fill="#334155">${r[1].toLocaleString()}</text>`;
  });
  g+=`<text class="c-fade" style="transition-delay:1s" x="20" y="500" font-size="17" font-weight="700" fill="${RED}">新宿署 3,595 ＝ 本富士署 336 的 10.7 倍</text>`;
  g+=`<text class="c-fade" style="transition-delay:1.1s" x="20" y="526" font-size="16" fill="#334155">但风险最高的站不是犯罪统计最高的站——东大前在本富士署辖内。</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

const CHARTS={d1:chartD1,d2:chartD2,d3:chartD3};
document.querySelectorAll("[data-chart]").forEach(el=>{
  const fn=CHARTS[el.dataset.chart]; if(fn) el.innerHTML=fn();
});

/* ---------- 固定翻页按钮 ---------- */
const btnPrev=document.createElement("button");
btnPrev.id="pgPrev"; btnPrev.className="pgbtn"; btnPrev.title="上一页（←）"; btnPrev.textContent="‹";
const btnNext=document.createElement("button");
btnNext.id="pgNext"; btnNext.className="pgbtn"; btnNext.title="下一页（→）"; btnNext.textContent="›";
stage.appendChild(btnPrev); stage.appendChild(btnNext);
btnPrev.onclick=()=>show(cur-1);
btnNext.onclick=()=>show(cur+1);

/* 目录按钮（等同 G 键） */
const btnGrid=document.createElement("button");
btnGrid.id="pgGrid"; btnGrid.title="页目录（G）";
btnGrid.innerHTML="<b>▦</b>目录";
stage.appendChild(btnGrid);

/* ---------- 页目录 ---------- */
const grid=document.createElement("div"); grid.id="grid";
grid.innerHTML=`<h4>目录 · 点击任意页跳转</h4><div class="cells">`+
  SLIDES.map((s,i)=>`<div class="c" data-i="${i}"><b>${String(i+1).padStart(2,"0")}${s.step?" · "+s.step:""}</b><span>${s.title}</span></div>`).join("")+
  `</div>
  <div class="keys">
    <div><kbd>←</kbd><kbd>→</kbd>　上一页 / 下一页</div>
    <div><kbd>空格</kbd>　下一页</div>
    <div><kbd>1</kbd>–<kbd>9</kbd><kbd>0</kbd>　直达第 1–10 页</div>
    <div><kbd>G</kbd>　打开/关闭本目录</div>
    <div><kbd>P</kbd>　附录（术语表与追问材料）</div>
    <div><kbd>F</kbd>　全屏 / 退出全屏</div>
    <div><kbd>Esc</kbd>　关闭当前弹层</div>
    <div>图上「⤢ 4 处放大」　打开文京—台东放大图</div>
  </div>
  <div class="gfoot">
    <button id="gApx">打开附录（P）</button>
    <button id="gClose">关闭目录（Esc）</button>
  </div>`;
stage.appendChild(grid);
grid.addEventListener("click",e=>{
  if(e.target.id==="gApx"){ grid.classList.remove("on"); apx.classList.add("on"); return; }
  if(e.target.id==="gClose"){ grid.classList.remove("on"); return; }
  const c=e.target.closest(".c"); if(!c) return;
  show(+c.dataset.i); grid.classList.remove("on");
});
btnGrid.onclick=()=>{ grid.classList.toggle("on"); btnGrid.blur(); };

/* 让 show() 同时维护按钮状态与目录高亮 */
const _origShow = show;
show = function(i){
  _origShow(i);
  if(btnPrev) btnPrev.disabled = (cur<=0);
  if(btnNext) btnNext.disabled = (cur>=SLIDES.length-1);
  grid.querySelectorAll(".c").forEach(el=> el.classList.toggle("cur", +el.dataset.i===cur));
};
show(cur);
document.addEventListener("keydown",e=>{
  if(e.key==="g"||e.key==="G"){ grid.classList.toggle("on"); return; }
  if(e.key==="Escape"){ grid.classList.remove("on"); return; }
  if(e.key>="1"&&e.key<="9"){ show(+e.key-1); return; }
  if(e.key==="0"){ show(9); return; }
});
/* ---- 图上放大弹层 ---- */
const zov = document.createElement("div");
zov.id = "zoom";
zov.innerHTML = `<figure><img alt=""><div class="zcap"></div></figure><button class="zx" aria-label="关闭">✕</button>`;
document.body.appendChild(zov);
window.toggleCase = () => {
  const c = document.getElementById('caseCard');
  const b = document.querySelector('.caseBtn');
  if (!c) return;
  c.classList.toggle('on');
  if (b) b.style.visibility = c.classList.contains('on') ? 'hidden' : 'visible';
};
window.toggleInset = () => {
  const c = document.getElementById('insetCard');
  if (c) c.classList.toggle('on');
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const c = document.getElementById('insetCard');
    if (c) c.classList.remove('on');
    const k = document.getElementById('caseCard');
    if (k) k.classList.remove('on');
    const cb = document.querySelector('.caseBtn'); if (cb) cb.style.visibility = 'visible';
  }
});

window.openZoom = (src, cap) => {
  zov.querySelector("img").src = src;
  zov.querySelector(".zcap").textContent = cap || "";
  zov.classList.add("on");
};
zov.addEventListener("click", e=>{ zov.classList.remove("on"); });
</script>
</body>
</html>
